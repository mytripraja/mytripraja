<html lang="en">
<head>
<meta charset="UTF-8">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  :root {
    --bg: #05010f;
    --neon-blue: #0075ff;
    --neon-purple: #8a2be2;
    --text-main: #ffffff;
    --text-muted: #8b8b9c;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: var(--bg);
    /* A subtle space-like radial gradient background */
    background-image: radial-gradient(circle at 20% 30%, rgba(138, 43, 226, 0.15) 0%, transparent 40%),
                      radial-gradient(circle at 80% 60%, rgba(0, 117, 255, 0.1) 0%, transparent 40%);
    color: var(--text-main);
    font-family: 'Inter', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ===== HEADER ===== */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 30px 50px;
    position: relative;
    z-index: 10;
  }
  .brand {
    font-size: 24px;
    font-weight: 800;
  }
  .brand span { color: #8b8b9c; font-weight: 500; }
  
  .social-icons { display: flex; gap: 20px; }
  .social-icons a { color: #fff; opacity: 0.7; transition: opacity 0.3s; }
  .social-icons a:hover { opacity: 1; }

  /* ===== MAIN CONTAINER ===== */
  .main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* ===== HERO TEXT ===== */
  .hero-text {
    text-align: center;
    margin-bottom: 20px;
    z-index: 10;
  }
  .eyebrow {
    font-size: 13px;
    letter-spacing: 4px;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 15px;
  }
  h1 {
    font-size: 48px;
    font-weight: 700;
  }
  h1 .highlight {
    background: linear-gradient(90deg, #c084fc, #60a5fa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* ===== HORIZONTAL LIGHT BEAM ===== */
  .light-beam-wrapper {
    position: absolute;
    top: 55%;
    left: 0;
    width: 100%;
    transform: translateY(-50%);
    z-index: 1;
    pointer-events: none;
  }
  .beam-core {
    height: 2px;
    width: 100%;
    background: rgba(255, 255, 255, 0.8);
    box-shadow: 
      0 0 10px 2px #fff,
      0 0 30px 8px var(--neon-purple),
      0 0 80px 20px var(--neon-blue);
  }

  /* ===== COUNTDOWN TIMER SECTION ===== */
  .timer-section {
    position: relative;
    width: 480px;
    height: 480px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
    margin: 20px 0;
  }

  /* Glowing Rings */
  .ring {
    position: absolute;
    border-radius: 50%;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
  }
  .ring-outer {
    width: 420px; height: 420px;
    border: 2px solid rgba(0, 117, 255, 0.5);
    box-shadow: 
      0 0 20px 2px rgba(0, 117, 255, 0.4),
      inset 0 0 30px 5px rgba(0, 117, 255, 0.3),
      0 0 80px 15px rgba(138, 43, 226, 0.4);
  }
  .ring-middle {
    width: 360px; height: 360px;
    border: 1.5px solid rgba(138, 43, 226, 0.6);
    box-shadow: 
      0 0 15px rgba(138, 43, 226, 0.5),
      inset 0 0 20px rgba(138, 43, 226, 0.4);
  }
  .ring-inner {
    width: 320px; height: 320px;
    background: var(--bg); /* Masks the beam behind the text */
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.8);
  }

  /* Starburst Flares */
  .flare {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 150px;
    height: 30px;
    background: radial-gradient(ellipse at center, rgba(255,255,255,1) 0%, rgba(0,117,255,0.5) 30%, transparent 70%);
    z-index: 6;
  }
  .flare.left { left: -60px; }
  .flare.right { right: -60px; }

  /* Timer Content */
  .timer-content {
    position: relative;
    z-index: 10;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
  }
  .timer-label, .timer-date {
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--text-muted);
    text-transform: uppercase;
  }
  
  .countdown-row {
    display: flex;
    align-items: flex-start;
    gap: 15px;
  }
  .time-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 50px;
  }
  .time-box .num {
    font-size: 42px;
    font-weight: 700;
    line-height: 1;
    color: #fff;
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
  }
  .time-box .unit {
    font-size: 9px;
    letter-spacing: 2px;
    margin-top: 8px;
    color: var(--text-muted);
    text-transform: uppercase;
  }
  .colon {
    font-size: 32px;
    font-weight: 600;
    color: var(--text-muted);
    line-height: 1.1;
  }

  /* ===== EMAIL INPUT ===== */
  .notify-container {
    margin-top: 20px;
    z-index: 10;
  }
  .email-form {
    display: flex;
    align-items: center;
    background: rgba(10, 5, 25, 0.6);
    border: 1px solid rgba(138, 43, 226, 0.5);
    border-radius: 50px;
    padding: 5px 5px 5px 25px;
    width: 450px;
    box-shadow: 0 0 20px rgba(138, 43, 226, 0.2);
    backdrop-filter: blur(10px);
  }
  .email-form:focus-within {
    border-color: rgba(138, 43, 226, 1);
    box-shadow: 0 0 30px rgba(138, 43, 226, 0.4);
  }
  .email-form svg {
    color: var(--text-muted);
    margin-right: 15px;
  }
  .email-form input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #fff;
    font-size: 14px;
    font-family: inherit;
  }
  .email-form button {
    background: linear-gradient(90deg, #8a2be2, #0075ff);
    color: #fff;
    border: none;
    padding: 14px 30px;
    border-radius: 50px;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 1px;
    cursor: pointer;
    text-transform: uppercase;
    transition: filter 0.3s;
  }
  .email-form button:hover { filter: brightness(1.2); }

  @media (max-width: 768px) {
    h1 { font-size: 32px; }
    .timer-section { width: 320px; height: 320px; transform: scale(0.8); }
    .email-form { width: 90vw; max-width: 400px; }
    header { padding: 20px; }
  }
</style>
</head>

Since I can see you have a tab open for your `script.js` file, the bug is almost certainly happening in your JavaScript calculation. Here are the most common reasons a countdown timer zeroes out prematurely and how to fix them:

### 1. Invalid Date Format
If JavaScript can't parse the target date string, it will result in an invalid date, which often breaks the math and defaults the timer to zero. 
*   **The Fix:** Make sure you are using the ISO 8601 format for your target date, as it is the most widely supported across all browsers. 
*   **Example:** Change `new Date("11 Feb 2028").getTime()` or `new Date("11-02-2028").getTime()` to `new Date("2028-02-11T00:00:00").getTime()`.

### 2. Math or Logic Error
Countdown timers work by finding the difference (distance) between the target date and `new Date().getTime()`. If the distance evaluates to a negative number or `NaN` (Not a Number), the standard fallback is to display zeros.
*   **The Fix:** Add a quick `console.log(distance);` inside your timer interval function. If it prints `NaN`, you definitely have a date parsing issue. If it prints a negative number, your target date variable is somehow set in the past.

### 3. DOM Element Mismatch
If your script is calculating the time perfectly but targeting the wrong HTML IDs or classes, the front-end will just display the hardcoded `000` from your HTML file.
*   **The Fix:** Double-check that `document.getElementById("days")` (or whatever selector you are using) perfectly matches the IDs in your HTML.
