<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MyTripRaja — Launching Soon</title>
<style>
  :root{
    --purple:#8b3ff0;
    --blue:#2f5bff;
    --cyan:#00d4ff;
    --bg:#050510;
    --text:#f5f5f7;
    --muted:#9a9aa5;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;
    width:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'Segoe UI',Arial,Helvetica,sans-serif;
    overflow:hidden;
    perspective:1400px;
  }

  /* ====== 3D ANIMATED BACKGROUND ====== */
  #scene{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    transform-style:preserve-3d;
    transition:transform .25s ease-out;
    will-change:transform;
  }

  /* Deep space gradient */
  .space-bg{
    position:absolute;
    inset:0;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(139,63,240,.15) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 50%, rgba(47,91,255,.15) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 100%, rgba(139,63,240,.1) 0%, transparent 40%),
      radial-gradient(ellipse at 50% 0%, rgba(10,5,30,.8) 0%, transparent 60%),
      var(--bg);
  }

  /* Star field */
  #stars{
    position:absolute;
    inset:0;
    transform-style:preserve-3d;
  }
  .star{
    position:absolute;
    background:#fff;
    border-radius:50%;
    box-shadow:0 0 4px rgba(255,255,255,.8);
    animation:twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:.2;}
    50%{opacity:1;}
  }

  /* Animated nebula hazes */
  .haze{
    position:absolute;
    top:0;bottom:0;
    width:60vw;
    filter:blur(70px);
    opacity:.5;
    transform-style:preserve-3d;
  }
  .haze-left{
    left:-5vw;
    background:radial-gradient(circle at 30% 55%, rgba(139,63,240,.6), transparent 55%);
    animation:driftLeft 10s ease-in-out infinite;
  }
  .haze-right{
    right:-5vw;
    background:radial-gradient(circle at 70% 55%, rgba(47,91,255,.6), transparent 55%);
    animation:driftRight 12s ease-in-out infinite;
  }
  @keyframes driftLeft{
    0%{ transform:translate3d(0,0,0) rotate3d(1,1,0,0deg) scale(1); opacity:.45; }
    33%{ transform:translate3d(6vw,-5vh,150px) rotate3d(1,1,0,22deg) scale(1.3); opacity:.7; }
    66%{ transform:translate3d(-3vw,4vh,-100px) rotate3d(1,1,0,-18deg) scale(.9); opacity:.55; }
    100%{ transform:translate3d(0,0,0) rotate3d(1,1,0,0deg) scale(1); opacity:.45; }
  }
  @keyframes driftRight{
    0%{ transform:translate3d(0,0,0) rotate3d(1,-1,0,0deg) scale(1); opacity:.45; }
    33%{ transform:translate3d(-6vw,5vh,120px) rotate3d(1,-1,0,-22deg) scale(1.3); opacity:.7; }
    66%{ transform:translate3d(4vw,-4vh,-110px) rotate3d(1,-1,0,18deg) scale(.9); opacity:.55; }
    100%{ transform:translate3d(0,0,0) rotate3d(1,-1,0,0deg) scale(1); opacity:.45; }
  }

  /* Floating light orbs */
  .drift-orb{
    position:absolute;
    border-radius:50%;
    filter:blur(50px);
    transform-style:preserve-3d;
  }
  .orb1{
    width:35vw; height:35vw;
    top:-10vh; left:30vw;
    background:radial-gradient(circle, rgba(139,63,240,.4), transparent 60%);
    animation:orbFloat1 14s ease-in-out infinite;
  }
  .orb2{
    width:28vw; height:28vw;
    bottom:-8vh; right:15vw;
    background:radial-gradient(circle, rgba(47,91,255,.35), transparent 60%);
    animation:orbFloat2 16s ease-in-out infinite;
  }
  .orb3{
    width:22vw; height:22vw;
    top:25vh; left:3vw;
    background:radial-gradient(circle, rgba(150,90,255,.3), transparent 60%);
    animation:orbFloat3 18s ease-in-out infinite;
  }
  .orb4{
    width:18vw; height:18vw;
    top:60vh; right:5vw;
    background:radial-gradient(circle, rgba(0,212,255,.2), transparent 60%);
    animation:orbFloat4 20s ease-in-out infinite;
  }
  @keyframes orbFloat1{
    0%{ transform:translate3d(0,0,0) scale(1); }
    25%{ transform:translate3d(-5vw,6vh,180px) scale(1.3); }
    50%{ transform:translate3d(4vw,10vh,-120px) scale(.85); }
    75%{ transform:translate3d(-3vw,3vh,100px) scale(1.15); }
    100%{ transform:translate3d(0,0,0) scale(1); }
  }
  @keyframes orbFloat2{
    0%{ transform:translate3d(0,0,0) scale(1); }
    25%{ transform:translate3d(5vw,-7vh,-140px) scale(1.2); }
    50%{ transform:translate3d(-4vw,-4vh,120px) scale(.8); }
    75%{ transform:translate3d(3vw,-9vh,-70px) scale(1.25); }
    100%{ transform:translate3d(0,0,0) scale(1); }
  }
  @keyframes orbFloat3{
    0%{ transform:translate3d(0,0,0) scale(1); }
    30%{ transform:translate3d(6vw,5vh,110px) scale(1.25); }
    60%{ transform:translate3d(-5vw,-6vh,-130px) scale(.85); }
    100%{ transform:translate3d(0,0,0) scale(1); }
  }
  @keyframes orbFloat4{
    0%{ transform:translate3d(0,0,0) scale(1); }
    35%{ transform:translate3d(-4vw,-3vh,90px) scale(1.2); }
    65%{ transform:translate3d(5vw,5vh,-100px) scale(.9); }
    100%{ transform:translate3d(0,0,0) scale(1); }
  }

  /* Horizontal energy beam */
  .beam{
    position:fixed;
    top:53%;
    left:0;
    width:100%;
    height:2px;
    background:linear-gradient(90deg,
      transparent 0%,
      rgba(139,63,240,.9) 15%,
      rgba(255,255,255,1) 25%,
      rgba(47,91,255,.9) 35%,
      transparent 50%,
      rgba(139,63,240,.9) 65%,
      rgba(255,255,255,1) 75%,
      rgba(47,91,255,.9) 85%,
      transparent 100%);
    background-size:200% 100%;
    box-shadow:0 0 25px 5px rgba(150,120,255,.6);
    z-index:1;
    pointer-events:none;
    animation:beamPulse 4s ease-in-out infinite, beamFlow 6s linear infinite;
    transform-style:preserve-3d;
  }
  @keyframes beamPulse{
    0%,100%{ opacity:.65; filter:blur(0px); }
    50%{ opacity:1; filter:blur(0.5px); }
  }
  @keyframes beamFlow{
    0%{ background-position:0% 0%; }
    100%{ background-position:-200% 0%; }
  }
  .beam-glow{
    position:fixed;
    top:53%;
    left:0;
    width:100%;
    height:70px;
    transform:translateY(-35px);
    background:linear-gradient(90deg, transparent, rgba(139,63,240,.3), rgba(255,255,255,.4), rgba(47,91,255,.3), transparent);
    background-size:200% 100%;
    filter:blur(20px);
    z-index:1;
    pointer-events:none;
    animation:beamFlow 6s linear infinite;
    mix-blend-mode:screen;
  }

  /* Lens flare effects */
  .lens-flare{
    position:absolute;
    border-radius:50%;
    pointer-events:none;
    transform-style:preserve-3d;
  }
  .flare1{
    width:120px; height:120px;
    top:48%; right:5%;
    background:radial-gradient(circle, rgba(255,255,255,.7) 0%, rgba(0,212,255,.3) 30%, transparent 65%);
    filter:blur(2px);
    animation:flarePulse1 5s ease-in-out infinite;
  }
  .flare2{
    width:90px; height:90px;
    top:46%; left:8%;
    background:radial-gradient(circle, rgba(255,255,255,.5) 0%, rgba(139,63,240,.3) 30%, transparent 65%);
    filter:blur(3px);
    animation:flarePulse2 7s ease-in-out infinite;
  }
  .flare3{
    width:60px; height:60px;
    top:50%; right:25%;
    background:radial-gradient(circle, rgba(255,255,255,.4) 0%, rgba(47,91,255,.2) 40%, transparent 65%);
    filter:blur(1px);
    animation:flarePulse3 4s ease-in-out infinite;
  }
  @keyframes flarePulse1{
    0%,100%{ transform:translate3d(0,0,50px) scale(1); opacity:.6; }
    50%{ transform:translate3d(-10px,5px,80px) scale(1.4); opacity:1; }
  }
  @keyframes flarePulse2{
    0%,100%{ transform:translate3d(0,0,30px) scale(1); opacity:.4; }
    50%{ transform:translate3d(8px,-5px,60px) scale(1.3); opacity:.8; }
  }
  @keyframes flarePulse3{
    0%,100%{ transform:translate3d(0,0,40px) scale(1); opacity:.5; }
    50%{ transform:translate3d(-5px,8px,70px) scale(1.5); opacity:.9; }
  }

  /* Beam spark travelers */
  .beam-spark{
    position:fixed;
    top:53%;
    width:90px;
    height:4px;
    transform:translateY(-2px);
    background:linear-gradient(90deg, transparent, #fff, transparent);
    filter:blur(1px);
    z-index:1;
    pointer-events:none;
    box-shadow:0 0 14px 4px rgba(255,255,255,.9);
  }
  .beam-spark.s1{ animation:sparkTravel 5s linear infinite; }
  .beam-spark.s2{ animation:sparkTravel 5s linear infinite 2.5s; }
  @keyframes sparkTravel{
    0%{ left:-10%; opacity:0; }
    10%{ opacity:1; }
    90%{ opacity:1; }
    100%{ left:110%; opacity:0; }
  }

  /* Canvas for animated particles */
  #particleCanvas{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
  }

  /* ====== PAGE LAYOUT (single viewport, no scroll) ====== */
  .page{
    position:relative;
    z-index:2;
    height:100vh;
    height:100dvh;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    padding:clamp(12px,2vh,28px) clamp(16px,3vw,40px);
    overflow:hidden;
  }

  /* Header */
  header{
    width:100%;
    max-width:1400px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-shrink:0;
  }
  .brand{
    font-size:clamp(18px,2.4vh,26px);
    font-weight:700;
    letter-spacing:.5px;
  }
  .brand span{
    background:linear-gradient(90deg,var(--purple),var(--blue));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .socials{
    display:flex;
    gap:14px;
  }
  .socials a{
    width:34px;
    height:34px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.25);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    text-decoration:none;
    font-size:15px;
    transition:.25s;
  }
  .socials a:hover{
    background:rgba(255,255,255,.12);
    border-color:rgba(255,255,255,.5);
    transform:scale(1.1);
  }

  /* Subtitle + Heading */
  .hero-text{
    text-align:center;
    flex-shrink:0;
  }
  .eyebrow{
    letter-spacing:5px;
    font-size:clamp(11px,1.4vh,15px);
    color:var(--muted);
    text-transform:uppercase;
    margin-bottom:clamp(6px,1vh,14px);
  }
  h1{
    font-size:clamp(24px, 4.8vh, 56px);
    text-align:center;
    font-weight:800;
    line-height:1.15;
  }
  h1 .grad{
    background:linear-gradient(90deg,var(--purple),var(--blue));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  /* Ring + Countdown */
  .ring-wrap{
    position:relative;
    width:min(48vh, 88vw, 520px);
    aspect-ratio:1/1;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:1;
    min-height:0;
    perspective:900px;
  }
  .ring{
    position:absolute;
    border-radius:50%;
    background:conic-gradient(from 200deg, var(--purple), var(--blue), var(--purple));
    filter:drop-shadow(0 0 18px rgba(120,90,255,.6));
    transform-style:preserve-3d;
    animation:ringSpin 16s linear infinite;
  }
  .ring::after{
    content:"";
    position:absolute;
    inset:2px;
    border-radius:50%;
    background:var(--bg);
  }
  .ring.r1{inset:0; animation-duration:18s;}
  .ring.r2{inset:5%;opacity:.85; animation-duration:13s; animation-direction:reverse;}
  .ring.r3{inset:10%;opacity:.6; animation-duration:10s;}
  @keyframes ringSpin{
    0%{ transform:rotate3d(1,1,0,0deg) rotateZ(0deg); }
    50%{ transform:rotate3d(1,1,0,20deg) rotateZ(180deg); }
    100%{ transform:rotate3d(1,1,0,0deg) rotateZ(360deg); }
  }

  /* Ring glow effect */
  .ring-glow{
    position:absolute;
    inset:-15%;
    border-radius:50%;
    background:radial-gradient(circle, rgba(139,63,240,.15) 30%, transparent 70%);
    filter:blur(30px);
    animation:ringGlowPulse 4s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes ringGlowPulse{
    0%,100%{ opacity:.5; transform:scale(1); }
    50%{ opacity:.8; transform:scale(1.08); }
  }

  .ring-core{
    position:relative;
    z-index:3;
    width:60%;
    aspect-ratio:1/1;
    border-radius:50%;
    background:rgba(5,5,16,.9);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:clamp(6px,1.4vh,16px);
    padding:clamp(8px,1.5vh,18px);
  }
  .coming-in{
    letter-spacing:3.5px;
    font-size:clamp(10px,1.3vh,14px);
    color:var(--muted);
    text-transform:uppercase;
  }
  .countdown{
    display:flex;
    gap:clamp(6px,1.4vh,16px);
    align-items:flex-start;
  }
  .countdown .unit{
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .countdown .num{
    font-size:clamp(22px, 5.8vh, 52px);
    font-weight:800;
    font-variant-numeric:tabular-nums;
    line-height:1;
    text-shadow:0 0 20px rgba(150,120,255,.5);
  }
  .countdown .lbl{
    font-size:clamp(8px,0.95vh,11px);
    letter-spacing:2px;
    color:var(--muted);
    margin-top:6px;
    text-transform:uppercase;
  }
  .countdown .colon{
    font-size:clamp(18px, 4.8vh, 42px);
    font-weight:700;
    color:var(--muted);
    padding-top:2px;
  }
  .target-date{
    letter-spacing:3.5px;
    font-size:clamp(10px,1.3vh,14px);
    color:var(--muted);
  }

  /* Email form */
  .form-wrap{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    flex-shrink:0;
    padding-bottom:clamp(4px,1vh,12px);
  }
  form{
    width:100%;
    max-width:540px;
    display:flex;
    align-items:center;
    gap:8px;
    border:1px solid rgba(139,63,240,.5);
    border-radius:40px;
    padding:clamp(4px,0.7vh,6px) clamp(4px,0.7vh,6px) clamp(4px,0.7vh,6px) 20px;
    background:rgba(20,10,35,.4);
    box-shadow:0 0 30px rgba(90,50,200,.2);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
  }
  form svg{flex-shrink:0;opacity:.7;}
  form input{
    flex:1;
    min-width:0;
    background:transparent;
    border:none;
    outline:none;
    color:#fff;
    font-size:clamp(13px,1.8vh,16px);
    padding:clamp(7px,1.3vh,11px) 0;
  }
  form input::placeholder{color:#8a8a95;}
  form button{
    border:none;
    cursor:pointer;
    padding:clamp(9px,1.7vh,14px) clamp(16px,2.4vw,28px);
    border-radius:30px;
    font-weight:700;
    font-size:clamp(11px,1.4vh,13px);
    letter-spacing:.5px;
    color:#fff;
    background:linear-gradient(90deg,var(--purple),var(--blue));
    transition:.25s;
    white-space:nowrap;
    text-transform:uppercase;
  }
  form button:hover{filter:brightness(1.15);transform:scale(1.03);}
  form button:disabled{opacity:.6;cursor:not-allowed;transform:none;}

  .status-msg{
    margin-top:clamp(4px,0.8vh,12px);
    font-size:clamp(10px,1.2vh,12px);
    min-height:14px;
    text-align:center;
  }
  .status-msg.ok{color:#7CFFB2;}
  .status-msg.err{color:#ff8080;}

  .live-msg{
    font-size:clamp(20px,4vw,30px);
    font-weight:800;
    background:linear-gradient(90deg,var(--purple),var(--blue));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  /* Responsive */
  @media(max-width:520px){
    .countdown{gap:6px;}
    form{padding:5px 5px 5px 14px;}
    form button{padding:10px 14px;}
    .socials{gap:10px;}
    .socials a{width:30px;height:30px;}
  }
  @media(max-height:700px){
    .ring-wrap{width:min(40vh, 85vw, 420px);}
    h1{font-size:clamp(20px,4vh,42px);}
  }
  @media(max-height:600px){
    .ring-wrap{width:min(34vh, 80vw, 360px);}
    .eyebrow{margin-bottom:4px;}
  }
</style>
</head>
<body>

<!-- Animated particle canvas -->
<canvas id="particleCanvas"></canvas>

<!-- 3D parallax scene -->
<div id="scene">
  <div class="space-bg"></div>
  <div id="stars"></div>
  <div class="haze haze-left"></div>
  <div class="haze haze-right"></div>
  <div class="drift-orb orb1"></div>
  <div class="drift-orb orb2"></div>
  <div class="drift-orb orb3"></div>
  <div class="drift-orb orb4"></div>
  <div class="lens-flare flare1"></div>
  <div class="lens-flare flare2"></div>
  <div class="lens-flare flare3"></div>
  <div class="beam-glow"></div>
  <div class="beam"></div>
  <div class="beam-spark s1"></div>
  <div class="beam-spark s2"></div>
</div>

<!-- Page content (single viewport) -->
<div class="page">
  <header>
    <div class="brand">My<span>Trip</span>Raja</div>
    <div class="socials">
      <a href="https://www.facebook.com/profile.php?id=61577792564324" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06c0 5 3.66 9.15 8.44 9.94v-7.03H7.9v-2.91h2.54V9.85c0-2.5 1.49-3.89 3.78-3.89 1.1 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.88h2.78l-.44 2.91h-2.34V22c4.78-.79 8.44-4.94 8.44-9.94Z"/></svg>
      </a>
      <a href="https://www.instagram.com/mytripraja/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>
      </a>
      <a href="https://www.linkedin.com/company/mytripraja/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5ZM3 9h4v12H3V9Zm7 0h3.8v1.7h.05c.53-.95 1.83-1.95 3.77-1.95 4.03 0 4.78 2.53 4.78 5.83V21h-4v-5.6c0-1.34-.02-3.06-1.87-3.06-1.87 0-2.16 1.44-2.16 2.96V21h-4V9Z"/></svg>
      </a>
    </div>
  </header>

  <div class="hero-text">
    <div class="eyebrow">We're crafting something extraordinary</div>
    <h1>New experience <span class="grad">launching soon</span></h1>
  </div>

  <div class="ring-wrap">
    <div class="ring-glow"></div>
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div class="ring-core" id="ringCore">
      <div class="coming-in">Coming in</div>
      <div class="countdown" id="countdown">
        <div class="unit"><div class="num" id="days">00</div><div class="lbl">Days</div></div>
        <div class="colon">:</div>
        <div class="unit"><div class="num" id="hours">00</div><div class="lbl">Hours</div></div>
        <div class="colon">:</div>
        <div class="unit"><div class="num" id="minutes">00</div><div class="lbl">Minutes</div></div>
        <div class="colon">:</div>
        <div class="unit"><div class="num" id="seconds">00</div><div class="lbl">Seconds</div></div>
      </div>
      <div class="target-date">11 FEB 2028</div>
    </div>
  </div>

  <div class="form-wrap">
    <form id="notifyForm" autocomplete="off">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 6 10 7L22 6"/></svg>
      <input type="email" id="emailInput" placeholder="Enter your email address" required>
      <button type="submit" id="notifyBtn">Notify Me</button>
    </form>
    <div class="status-msg" id="statusMsg"></div>
  </div>
</div>

<script>
/* =========================================================
   CONFIG
========================================================= */
// Launch: 11 Feb 2028, 4:15 PM IST (UTC+5:30)
const TARGET_DATE = new Date("2028-02-11T16:15:00+05:30");

// Backend endpoint (update when ready)
const SUBSCRIBE_API_URL = "https://your-backend.onrender.com/api/coming-soon/subscribe";

/* =========================================================
   ANIMATED PARTICLE CANVAS
========================================================= */
(function initParticles(){
  const canvas = document.getElementById('particleCanvas');
  const ctx = canvas.getContext('2d');
  let W, H;
  const particles = [];
  const PARTICLE_COUNT = 60;

  function resize(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  class Particle {
    constructor(){
      this.reset();
    }
    reset(){
      this.x = Math.random() * W;
      this.y = Math.random() * H;
      this.z = Math.random() * 3 + 0.5;
      this.size = Math.random() * 2.5 + 0.5;
      this.speedX = (Math.random() - 0.5) * 0.3;
      this.speedY = (Math.random() - 0.5) * 0.15;
      this.alpha = Math.random() * 0.5 + 0.1;
      this.alphaDir = (Math.random() - 0.5) * 0.008;
      const hues = [270, 230, 190]; // purple, blue, cyan
      this.hue = hues[Math.floor(Math.random() * hues.length)];
      this.saturation = 70 + Math.random() * 30;
    }
    update(){
      this.x += this.speedX * this.z;
      this.y += this.speedY * this.z;
      this.alpha += this.alphaDir;
      if(this.alpha <= 0.05 || this.alpha >= 0.6) this.alphaDir *= -1;
      if(this.x < -20 || this.x > W+20 || this.y < -20 || this.y > H+20) this.reset();
    }
    draw(){
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size * this.z, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${this.hue}, ${this.saturation}%, 70%, ${this.alpha})`;
      ctx.fill();
      // Soft glow
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size * this.z * 3, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${this.hue}, ${this.saturation}%, 60%, ${this.alpha * 0.15})`;
      ctx.fill();
    }
  }

  for(let i = 0; i < PARTICLE_COUNT; i++){
    particles.push(new Particle());
  }

  function animate(){
    ctx.clearRect(0, 0, W, H);
    particles.forEach(p => {
      p.update();
      p.draw();
    });
    requestAnimationFrame(animate);
  }
  animate();
})();

/* =========================================================
   STAR FIELD
========================================================= */
(function generateStars(){
  const container = document.getElementById('stars');
  const count = 160;
  for(let i = 0; i < count; i++){
    const s = document.createElement('div');
    s.className = 'star';
    const depth = Math.random();
    const size = depth * 2.5 + 0.6;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.top = Math.random() * 100 + 'vh';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.opacity = (Math.random() * 0.6 + 0.3).toFixed(2);
    s.style.transform = `translateZ(${(depth * 350 - 175).toFixed(0)}px)`;
    s.style.animationDelay = (Math.random() * 3).toFixed(2) + 's';
    s.style.animationDuration = (2 + Math.random() * 4).toFixed(1) + 's';
    s.dataset.depth = depth.toFixed(2);
    container.appendChild(s);
  }
})();

/* =========================================================
   3D PARALLAX
========================================================= */
(function initParallax(){
  const scene = document.getElementById('scene');
  let targetX = 0, targetY = 0, curX = 0, curY = 0;

  function apply(){
    curX += (targetX - curX) * 0.05;
    curY += (targetY - curY) * 0.05;
    scene.style.transform = `rotateX(${curY}deg) rotateY(${curX}deg) translateZ(0)`;
    requestAnimationFrame(apply);
  }
  requestAnimationFrame(apply);

  window.addEventListener('mousemove', (e) => {
    const nx = (e.clientX / window.innerWidth) - 0.5;
    const ny = (e.clientY / window.innerHeight) - 0.5;
    targetX = nx * 16;
    targetY = -ny * 12;
  });

  window.addEventListener('touchmove', (e) => {
    if(!e.touches || !e.touches[0]) return;
    const t = e.touches[0];
    const nx = (t.clientX / window.innerWidth) - 0.5;
    const ny = (t.clientY / window.innerHeight) - 0.5;
    targetX = nx * 16;
    targetY = -ny * 12;
  }, { passive:true });

  window.addEventListener('deviceorientation', (e) => {
    if(e.gamma == null || e.beta == null) return;
    targetX = Math.max(-18, Math.min(18, e.gamma / 3));
    targetY = Math.max(-14, Math.min(14, (e.beta - 45) / 4));
  });

  window.addEventListener('mouseleave', () => { targetX = 0; targetY = 0; });

  // Gentle auto-drift when idle
  let autoAngle = 0;
  let lastMove = Date.now();
  window.addEventListener('mousemove', () => { lastMove = Date.now(); });
  setInterval(() => {
    if(Date.now() - lastMove > 3000){
      autoAngle += 0.008;
      targetX = Math.sin(autoAngle) * 5;
      targetY = Math.cos(autoAngle * 0.7) * 3;
    }
  }, 50);
})();

/* =========================================================
   COUNTDOWN
========================================================= */
const els = {
  days: document.getElementById('days'),
  hours: document.getElementById('hours'),
  minutes: document.getElementById('minutes'),
  seconds: document.getElementById('seconds'),
};
const ringCore = document.getElementById('ringCore');
let countdownFinished = false;

function pad(n){ return String(n).padStart(2,'0'); }

function tick(){
  const now = new Date();
  const diff = TARGET_DATE.getTime() - now.getTime();

  if(diff <= 0){
    if(!countdownFinished){
      countdownFinished = true;
      clearInterval(timer);
      ringCore.innerHTML = '<div class="live-msg">We\'re live!</div><div class="target-date" style="margin-top:10px;">Thank you for waiting 🎉</div>';
    }
    return;
  }

  const days = Math.floor(diff / (1000*60*60*24));
  const hours = Math.floor((diff / (1000*60*60)) % 24);
  const minutes = Math.floor((diff / (1000*60)) % 60);
  const seconds = Math.floor((diff / 1000) % 60);

  els.days.textContent = pad(days);
  els.hours.textContent = pad(hours);
  els.minutes.textContent = pad(minutes);
  els.seconds.textContent = pad(seconds);
}
tick();
const timer = setInterval(tick, 1000);

/* =========================================================
   EMAIL CAPTURE (localStorage + optional backend)
========================================================= */
const form = document.getElementById('notifyForm');
const emailInput = document.getElementById('emailInput');
const notifyBtn = document.getElementById('notifyBtn');
const statusMsg = document.getElementById('statusMsg');
const LOCAL_KEY = 'mytripraja_notify_subscribers';

function saveLocally(email, ts){
  try{
    const list = JSON.parse(localStorage.getItem(LOCAL_KEY) || '[]');
    list.push({ email, subscribed_at: ts });
    localStorage.setItem(LOCAL_KEY, JSON.stringify(list));
  }catch(e){ /* localStorage unavailable */ }
}

form.addEventListener('submit', async function(e){
  e.preventDefault();
  const email = emailInput.value.trim();
  if(!email) return;

  notifyBtn.disabled = true;
  notifyBtn.textContent = 'Sending...';
  statusMsg.textContent = '';
  statusMsg.className = 'status-msg';

  const payload = {
    email: email,
    subscribed_at: new Date().toISOString()
  };

  try{
    const res = await fetch(SUBSCRIBE_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    if(!res.ok) throw new Error('Server error');

    saveLocally(payload.email, payload.subscribed_at);
    statusMsg.textContent = "You're on the list — we'll email you at launch!";
    statusMsg.classList.add('ok');
    emailInput.value = '';
  }catch(err){
    // Backend not reachable — still save locally
    saveLocally(payload.email, payload.subscribed_at);
    statusMsg.textContent = "Thanks! We've saved your email. You'll hear from us!";
    statusMsg.classList.add('ok');
    emailInput.value = '';
  }finally{
    notifyBtn.disabled = false;
    notifyBtn.textContent = 'Notify Me';
  }
});
</script>
