<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MyTripRaja — Launching Soon</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div class="page">
  <header>
    <div class="brand">My<span>Trip</span>Raja</div>
    <!-- Plain icons, NO borders -->
    <div class="socials">
      <a href="https://www.facebook.com/profile.php?id=61577792564324" target="_blank" rel="noopener noreferrer" aria-label="Facebook"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M9.198 21.5h4v-8.01h3.604l.396-3.98h-4V7.5a1 1 0 0 1 1-1h3v-4h-3a5 5 0 0 0-5 5v2.01h-2l-.396 3.98h2.396v8.01Z"/></svg></a>
      <a href="https://www.instagram.com/mytripraja/" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="5"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg></a>
      <a href="https://www.linkedin.com/company/mytripraja/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6.94 5a2 2 0 1 1-4 0 2 2 0 0 1 4 0ZM3.5 8.5h3v12h-3v-12Zm5.5 0h3v1.6s1.2-2 3.9-2c2.8 0 4.1 1.7 4.1 5v7.4h-3v-6.5c0-1.5-.5-2.8-2-2.8s-2.5 1.3-2.5 2.8v6.5H9v-12Z"/></svg></a>
    </div>
  </header>

  <div class="hero">
    <div class="eyebrow">We're crafting something extraordinary</div>
    <h1>New experience <span class="grad">launching soon</span></h1>
  </div>

  <div class="ring-section">
    <div class="ring-container">
      <div class="ring-outer-glow"></div>
      <div class="neon-ring ring-1"></div>
      <div class="neon-ring ring-2"></div>
      <div class="neon-ring ring-3"></div>
      <!-- Starbursts at ring edges -->
      <div class="starburst starburst-right"></div>
      <div class="starburst starburst-left"></div>
      <!-- Transparent center -->
      <div class="ring-center" id="ringCore">
        <div class="coming-in">Coming in</div>
        <div class="countdown" id="countdown">
          <div class="unit"><div class="num" id="days">000</div><div class="lbl">Days</div></div>
          <div class="colon">:</div>
          <div class="unit"><div class="num" id="hours">00</div><div class="lbl">Hours</div></div>
          <div class="colon">:</div>
          <div class="unit"><div class="num" id="minutes">00</div><div class="lbl">Minutes</div></div>
          <div class="colon">:</div>
          <div class="unit"><div class="num" id="seconds">00</div><div class="lbl">Seconds</div></div>
        </div>
        <div class="target-date">11 FEB 2028</div>
      </div>
    </div>
  </div>

  <div class="form-wrap">
    <form id="notifyForm" autocomplete="off">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 6 10 7L22 6"/></svg>
      <input type="email" id="emailInput" placeholder="Enter your email address" required>
      <button type="submit" id="notifyBtn">Notify Me</button>
    </form>
    <div class="status-msg" id="statusMsg"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
