<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyTripRaja — Launching Soon</title>
<style>
  :root{
    --purple:#8b3ff0;
    --blue:#2f5bff;
    --bg:#000000;
    --text:#f5f5f7;
    --muted:#9a9aa5;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;
    width:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'Segoe UI',Arial,Helvetica,sans-serif;
    overflow:hidden;
    perspective:1400px;
  }
  #scene{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    transform-style:preserve-3d;
    transition:transform .3s ease-out;
    will-change:transform;
  }
  #stars{
    position:absolute;
    inset:0;
    transform-style:preserve-3d;
  }
  .star{
    position:absolute;
    background:#fff;
    border-radius:50%;
    box-shadow:0 0 4px rgba(255,255,255,.8);
    animation:twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:.25;}
    50%{opacity:1;}
  }
  .haze-left, .haze-right{
    position:absolute;
    top:0;
    bottom:0;
    width:55vw;
    filter:blur(60px);
    opacity:.55;
  }
  .haze-left{
    left:0;
    background:radial-gradient(circle at 20% 55%, rgba(139,63,240,.55), transparent 60%);
    animation:driftLeft 9s ease-in-out infinite;
  }
  .haze-right{
    right:0;
    background:radial-gradient(circle at 80% 55%, rgba(47,91,255,.55), transparent 60%);
    animation:driftRight 11s ease-in-out infinite;
  }
  @keyframes driftLeft{
    0%{ transform:translate3d(0,0,0) rotate3d(1,1,0,0deg) scale(1); opacity:.5; }
    33%{ transform:translate3d(5vw,-4vh,120px) rotate3d(1,1,0,20deg) scale(1.2); opacity:.7; }
    66%{ transform:translate3d(-2vw,3vh,-80px) rotate3d(1,1,0,-15deg) scale(.95); opacity:.6; }
    100%{ transform:translate3d(0,0,0) rotate3d(1,1,0,0deg) scale(1); opacity:.5; }
  }
  @keyframes driftRight{
    0%{ transform:translate3d(0,0,0) rotate3d(1,-1,0,0deg) scale(1); opacity:.5; }
    33%{ transform:translate3d(-5vw,4vh,100px) rotate3d(1,-1,0,-20deg) scale(1.2); opacity:.7; }
    66%{ transform:translate3d(3vw,-3vh,-90px) rotate3d(1,-1,0,15deg) scale(.95); opacity:.6; }
    100%{ transform:translate3d(0,0,0) rotate3d(1,-1,0,0deg) scale(1); opacity:.5; }
  }
  .beam{
    position:fixed;
    top:53%;
    left:0;
    width:100%;
    height:2px;
    background:linear-gradient(90deg,
      transparent 0%,
      rgba(139,63,240,.9) 15%,
      rgba(255,255,255,1) 25%,
      rgba(47,91,255,.9) 35%,
      transparent 50%,
      rgba(139,63,240,.9) 65%,
      rgba(255,255,255,1) 75%,
      rgba(47,91,255,.9) 85%,
      transparent 100%);
    background-size:200% 100%;
    box-shadow:0 0 20px 4px rgba(150,120,255,.6);
    z-index:1;
    pointer-events:none;
    animation:beamPulse 4s ease-in-out infinite, beamFlow 6s linear infinite;
    transform-style:preserve-3d;
  }
  @keyframes beamPulse{
    0%,100%{ opacity:.7; filter:blur(0px); }
    50%{ opacity:1; filter:blur(0.5px); }
  }
  @keyframes beamFlow{
    0%{ background-position:0% 0%; }
    100%{ background-position:-200% 0%; }
  }
  .beam-glow{
    position:fixed;
    top:53%;
    left:0;
    width:100%;
    height:60px;
    transform:translateY(-30px);
    background:linear-gradient(90deg, transparent, rgba(139,63,240,.25), rgba(255,255,255,.35), rgba(47,91,255,.25), transparent);
    background-size:200% 100%;
    filter:blur(18px);
    z-index:1;
    pointer-events:none;
    animation:beamFlow 6s linear infinite;
    mix-blend-mode:screen;
  }
  .beam-spark{
    position:fixed;
    top:53%;
    width:80px;
    height:4px;
    transform:translateY(-2px);
    background:linear-gradient(90deg, transparent, #fff, transparent);
    filter:blur(1px);
    z-index:1;
    pointer-events:none;
    box-shadow:0 0 12px 3px rgba(255,255,255,.9);
  }
  .beam-spark.s1{ animation:sparkTravel 5s linear infinite; }
  .beam-spark.s2{ animation:sparkTravel 5s linear infinite 2.5s; }
  @keyframes sparkTravel{
    0%{ left:-10%; opacity:0; }
    10%{ opacity:1; }
    90%{ opacity:1; }
    100%{ left:110%; opacity:0; }
  }
  .drift-orb{
    position:absolute;
    border-radius:50%;
    filter:blur(50px);
  }
  .orb1{
    width:30vw; height:30vw;
    top:-5vh; left:35vw;
    background:radial-gradient(circle, rgba(139,63,240,.35), transparent 65%);
    animation:orbFloat1 13s ease-in-out infinite;
  }
  .orb2{
    width:25vw; height:25vw;
    bottom:-5vh; right:20vw;
    background:radial-gradient(circle, rgba(47,91,255,.3), transparent 65%);
    animation:orbFloat2 15s ease-in-out infinite;
  }
  .orb3{
    width:20vw; height:20vw;
    top:30vh; left:5vw;
    background:radial-gradient(circle, rgba(150,90,255,.25), transparent 65%);
    animation:orbFloat3 17s ease-in-out infinite;
  }
  @keyframes orbFloat1{
    0%{ transform:translate3d(0,0,0) scale(1); }
    25%{ transform:translate3d(-4vw,5vh,150px) scale(1.25); }
    50%{ transform:translate3d(3vw,8vh,-100px) scale(.9); }
    75%{ transform:translate3d(-3vw,2vh,80px) scale(1.1); }
    100%{ transform:translate3d(0,0,0) scale(1); }
  }
  @keyframes orbFloat2{
    0%{ transform:translate3d(0,0,0) scale(1); }
    25%{ transform:translate3d(4vw,-6vh,-120px) scale(1.15); }
    50%{ transform:translate3d(-3vw,-3vh,100px) scale(.85); }
    75%{ transform:translate3d(2vw,-8vh,-60px) scale(1.2); }
    100%{ transform:translate3d(0,0,0) scale(1); }
  }
  @keyframes orbFloat3{
    0%{ transform:translate3d(0,0,0) scale(1); }
    30%{ transform:translate3d(5vw,4vh,90px) scale(1.2); }
    60%{ transform:translate3d(-4vw,-5vh,-110px) scale(.9); }
    100%{ transform:translate3d(0,0,0) scale(1); }
  }

  .page{
    position:relative;
    z-index:2;
    height:100vh;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    padding:clamp(14px,2.5vh,30px) clamp(16px,3vw,40px);
    overflow:hidden;
  }

  header{
    width:100%;
    max-width:1400px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-shrink:0;
  }
  .brand{
    font-size:clamp(18px,2.4vh,26px);
    font-weight:700;
    letter-spacing:.5px;
  }
  .brand span{
    background:linear-gradient(90deg,var(--purple),var(--blue));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .socials{
    display:flex;
    gap:18px;
  }
  .socials a{
    width:36px;
    height:36px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.25);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    text-decoration:none;
    font-size:15px;
    transition:.2s;
  }
  .socials a:hover{
    background:rgba(255,255,255,.1);
  }

  .eyebrow{
    letter-spacing:5px;
    font-size:clamp(12px,1.6vh,16px);
    color:var(--muted);
    text-transform:uppercase;
    margin-top:clamp(8px,1.5vh,20px);
    margin-bottom:clamp(8px,1.6vh,18px);
    flex-shrink:0;
  }
  h1{
    font-size:clamp(26px, 5.4vh, 62px);
    text-align:center;
    font-weight:800;
    margin-bottom:0;
    flex-shrink:0;
    line-height:1.15;
  }
  h1 .grad{
    background:linear-gradient(90deg,var(--purple),var(--blue));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .ring-wrap{
    position:relative;
    width:min(56vh, 92vw, 580px);
    aspect-ratio:1/1;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:1;
    margin:clamp(6px,1vh,14px) 0;
    perspective:900px;
  }
  .ring{
    position:absolute;
    border-radius:50%;
    background:conic-gradient(from 200deg, var(--purple), var(--blue), var(--purple));
    filter:drop-shadow(0 0 14px rgba(120,90,255,.55));
    transform-style:preserve-3d;
    animation:ringSpin 16s linear infinite;
  }
  .ring::after{
    content:"";
    position:absolute;
    inset:1.5px;
    border-radius:50%;
    background:#000;
  }
  .ring.r1{inset:0; animation-duration:18s;}
  .ring.r2{inset:5%;opacity:.85; animation-duration:13s; animation-direction:reverse;}
  .ring.r3{inset:10%;opacity:.6; animation-duration:10s;}
  @keyframes ringSpin{
    0%{ transform:rotate3d(1,1,0,0deg) rotateZ(0deg); }
    50%{ transform:rotate3d(1,1,0,18deg) rotateZ(180deg); }
    100%{ transform:rotate3d(1,1,0,0deg) rotateZ(360deg); }
  }

  .ring-core{
    position:relative;
    z-index:3;
    width:64%;
    aspect-ratio:1/1;
    border-radius:50%;
    background:#000;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:clamp(8px,1.6vh,18px);
    padding:clamp(10px,2vh,20px);
  }
  .coming-in{
    letter-spacing:3.5px;
    font-size:clamp(11px,1.4vh,15px);
    color:var(--muted);
    text-transform:uppercase;
  }
  .countdown{
    display:flex;
    gap:clamp(8px,1.8vh,18px);
    align-items:flex-start;
  }
  .countdown .unit{
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .countdown .num{
    font-size:clamp(26px, 6.6vh, 58px);
    font-weight:800;
    font-variant-numeric:tabular-nums;
    line-height:1;
    text-shadow:0 0 18px rgba(150,120,255,.5);
  }
  .countdown .lbl{
    font-size:clamp(9px,1.05vh,12px);
    letter-spacing:2px;
    color:var(--muted);
    margin-top:8px;
    text-transform:uppercase;
  }
  .countdown .colon{
    font-size:clamp(22px, 5.6vh, 48px);
    font-weight:700;
    color:var(--muted);
    padding-top:2px;
  }
  .target-date{
    letter-spacing:3.5px;
    font-size:clamp(11px,1.4vh,15px);
    color:var(--muted);
  }

  .form-wrap{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    flex-shrink:0;
    margin-bottom:clamp(6px,1.5vh,16px);
  }
  form{
    width:100%;
    max-width:560px;
    display:flex;
    align-items:center;
    gap:8px;
    border:1px solid rgba(139,63,240,.6);
    border-radius:40px;
    padding:clamp(4px,0.8vh,6px) clamp(4px,0.8vh,6px) clamp(4px,0.8vh,6px) 22px;
    background:rgba(20,10,35,.35);
    box-shadow:0 0 25px rgba(90,50,200,.25);
  }
  form svg{flex-shrink:0;opacity:.8;}
  form input{
    flex:1;
    min-width:0;
    background:transparent;
    border:none;
    outline:none;
    color:#fff;
    font-size:clamp(13px,1.9vh,17px);
    padding:clamp(7px,1.5vh,12px) 0;
  }
  form input::placeholder{color:#8a8a95;}
  form button{
    border:none;
    cursor:pointer;
    padding:clamp(10px,1.9vh,15px) clamp(18px,2.6vw,30px);
    border-radius:30px;
    font-weight:700;
    font-size:clamp(12px,1.5vh,14px);
    letter-spacing:.5px;
    color:#fff;
    background:linear-gradient(90deg,var(--purple),var(--blue));
    transition:.2s;
    white-space:nowrap;
  }
  form button:hover{filter:brightness(1.15);}
  form button:disabled{opacity:.6;cursor:not-allowed;}

  .status-msg{
    margin-top:clamp(6px,1vh,16px);
    font-size:clamp(11px,1.3vh,13px);
    min-height:16px;
    text-align:center;
  }
  .status-msg.ok{color:#7CFFB2;}
  .status-msg.err{color:#ff8080;}

  .live-msg{
    font-size:clamp(20px,4vw,30px);
    font-weight:800;
    background:linear-gradient(90deg,var(--purple),var(--blue));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  @media(max-width:520px){
    .countdown{gap:8px;}
    form{padding:6px 6px 6px 16px;}
    form button{padding:12px 16px;}
  }
</style>
</head>
<body>

<div id="scene">
  <div id="stars"></div>
  <div class="haze-left"></div>
  <div class="haze-right"></div>
  <div class="drift-orb orb1"></div>
  <div class="drift-orb orb2"></div>
  <div class="drift-orb orb3"></div>
  <div class="beam-glow"></div>
  <div class="beam"></div>
  <div class="beam-spark s1"></div>
  <div class="beam-spark s2"></div>
</div>

<div class="page">
  <header>
    <div class="brand">My<span>Trip</span>Raja</div>
    <div class="socials">
      <a href="https://www.facebook.com/profile.php?id=61577792564324" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06c0 5 3.66 9.15 8.44 9.94v-7.03H7.9v-2.91h2.54V9.85c0-2.5 1.49-3.89 3.78-3.89 1.1 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.88h2.78l-.44 2.91h-2.34V22c4.78-.79 8.44-4.94 8.44-9.94Z"/></svg>
      </a>
      <a href="https://www.instagram.com/mytripraja/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>
      </a>
      <a href="https://www.linkedin.com/company/mytripraja/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5ZM3 9h4v12H3V9Zm7 0h3.8v1.7h.05c.53-.95 1.83-1.95 3.77-1.95 4.03 0 4.78 2.53 4.78 5.83V21h-4v-5.6c0-1.34-.02-3.06-1.87-3.06-1.87 0-2.16 1.44-2.16 2.96V21h-4V9Z"/></svg>
      </a>
    </div>
  </header>

  <div class="eyebrow">We're crafting something extraordinary</div>
  <h1>New experience <span class="grad">launching soon</span></h1>

  <div class="ring-wrap">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div class="ring-core" id="ringCore">
      <div class="coming-in">Coming in</div>
      <div class="countdown" id="countdown">
        <div class="unit"><div class="num" id="days">00</div><div class="lbl">Days</div></div>
        <div class="colon">:</div>
        <div class="unit"><div class="num" id="hours">00</div><div class="lbl">Hours</div></div>
        <div class="colon">:</div>
        <div class="unit"><div class="num" id="minutes">00</div><div class="lbl">Minutes</div></div>
        <div class="colon">:</div>
        <div class="unit"><div class="num" id="seconds">00</div><div class="lbl">Seconds</div></div>
      </div>
      <div class="target-date">11 FEB 2028 · 4:15 PM IST</div>
    </div>
  </div>

  <div class="form-wrap">
    <form id="notifyForm" autocomplete="off">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 6 10 7L22 6"/></svg>
      <input type="email" id="emailInput" placeholder="Enter your email address" required>
      <button type="submit" id="notifyBtn">Notify Me</button>
    </form>
    <div class="status-msg" id="statusMsg"></div>
  </div>
</div>

<script>
/* ---------------------------------------------------------
   CONFIG — edit these two values for your setup
--------------------------------------------------------- */
// Launch target: 11 Feb 2028, 4:15 PM IST (India Standard Time, UTC+5:30)
const TARGET_DATE = new Date("2028-02-11T16:15:00+05:30");

// Your backend endpoint that saves {email, subscribed_at} to Postgres.
// Point this at your mytripraja-backend deployment, e.g.:
// "https://mytripraja-backend.onrender.com/api/coming-soon/subscribe"
const SUBSCRIBE_API_URL = "https://your-backend.onrender.com/api/coming-soon/subscribe";
/* --------------------------------------------------------- */

// Starfield generation (with 3D depth)
(function generateStars(){
  const container = document.getElementById('stars');
  const count = 140;
  for(let i=0;i<count;i++){
    const s = document.createElement('div');
    s.className = 'star';
    const depth = Math.random(); // 0 = far, 1 = near
    const size = depth*2.4 + 0.8;
    s.style.width = size+'px';
    s.style.height = size+'px';
    s.style.top = Math.random()*100+'vh';
    s.style.left = Math.random()*100+'vw';
    s.style.opacity = (Math.random()*0.7+0.3).toFixed(2);
    s.style.transform = `translateZ(${(depth*300 - 150).toFixed(0)}px)`;
    s.style.animationDelay = (Math.random()*3).toFixed(2)+'s';
    s.dataset.depth = depth.toFixed(2);
    container.appendChild(s);
  }
})();

// 3D parallax: scene tilts toward pointer / device tilt
(function initParallax(){
  const scene = document.getElementById('scene');
  let targetX = 0, targetY = 0, curX = 0, curY = 0;

  function apply(){
    curX += (targetX - curX) * 0.06;
    curY += (targetY - curY) * 0.06;
    scene.style.transform = `rotateX(${curY}deg) rotateY(${curX}deg) translateZ(0)`;
    requestAnimationFrame(apply);
  }
  requestAnimationFrame(apply);

  window.addEventListener('mousemove', (e) => {
    const nx = (e.clientX / window.innerWidth) - 0.5;
    const ny = (e.clientY / window.innerHeight) - 0.5;
    targetX = nx * 14;   // rotateY range
    targetY = -ny * 10;  // rotateX range
  });

  window.addEventListener('touchmove', (e) => {
    if(!e.touches || !e.touches[0]) return;
    const t = e.touches[0];
    const nx = (t.clientX / window.innerWidth) - 0.5;
    const ny = (t.clientY / window.innerHeight) - 0.5;
    targetX = nx * 14;
    targetY = -ny * 10;
  }, { passive:true });

  window.addEventListener('deviceorientation', (e) => {
    if(e.gamma == null || e.beta == null) return;
    targetX = Math.max(-16, Math.min(16, e.gamma / 3));
    targetY = Math.max(-12, Math.min(12, (e.beta - 45) / 4));
  });

  window.addEventListener('mouseleave', () => { targetX = 0; targetY = 0; });
})();

// Countdown logic
const els = {
  days: document.getElementById('days'),
  hours: document.getElementById('hours'),
  minutes: document.getElementById('minutes'),
  seconds: document.getElementById('seconds'),
};
const ringCore = document.getElementById('ringCore');
let countdownFinished = false;

function pad(n){ return String(n).padStart(2,'0'); }

function tick(){
  const now = new Date();
  const diff = TARGET_DATE.getTime() - now.getTime();

  if(diff <= 0){
    if(!countdownFinished){
      countdownFinished = true;
      clearInterval(timer);
      ringCore.innerHTML = '<div class="live-msg">We\'re live!</div><div class="target-date" style="margin-top:10px;">Thank you for waiting 🎉</div>';
    }
    return;
  }

  const days = Math.floor(diff / (1000*60*60*24));
  const hours = Math.floor((diff / (1000*60*60)) % 24);
  const minutes = Math.floor((diff / (1000*60)) % 60);
  const seconds = Math.floor((diff / 1000) % 60);

  els.days.textContent = pad(days);
  els.hours.textContent = pad(hours);
  els.minutes.textContent = pad(minutes);
  els.seconds.textContent = pad(seconds);
}
tick();
const timer = setInterval(tick, 1000);

// Email capture
const form = document.getElementById('notifyForm');
const emailInput = document.getElementById('emailInput');
const notifyBtn = document.getElementById('notifyBtn');
const statusMsg = document.getElementById('statusMsg');
const LOCAL_KEY = 'mytripraja_notify_subscribers';

function saveLocally(email, ts){
  try{
    const list = JSON.parse(localStorage.getItem(LOCAL_KEY) || '[]');
    list.push({ email, subscribed_at: ts });
    localStorage.setItem(LOCAL_KEY, JSON.stringify(list));
  }catch(e){ /* localStorage unavailable, ignore */ }
}

form.addEventListener('submit', async function(e){
  e.preventDefault();
  const email = emailInput.value.trim();
  if(!email) return;

  notifyBtn.disabled = true;
  notifyBtn.textContent = 'Sending...';
  statusMsg.textContent = '';
  statusMsg.className = 'status-msg';

  const payload = {
    email: email,
    subscribed_at: new Date().toISOString()
  };

  try{
    const res = await fetch(SUBSCRIBE_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    if(!res.ok) throw new Error('Server error');

    saveLocally(payload.email, payload.subscribed_at);
    statusMsg.textContent = "You're on the list — we'll email you at launch!";
    statusMsg.classList.add('ok');
    emailInput.value = '';
  }catch(err){
    // Backend not reachable yet — still keep the email locally so nothing is lost
    saveLocally(payload.email, payload.subscribed_at);
    statusMsg.textContent = "Saved on this device. We'll sync it once you're online.";
    statusMsg.classList.add('err');
  }finally{
    notifyBtn.disabled = false;
    notifyBtn.textContent = 'Notify Me';
  }
});
</script>

</body>
</html>
